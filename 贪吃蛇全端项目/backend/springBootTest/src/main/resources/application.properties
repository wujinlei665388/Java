# ============================================================
#  贪吃蛇后端配置  snake-backend
#  ★ 重要：本机是"每次重置"的环境，请不要随意删改下面的注释，
#    这些注释是给后续 AI / 你本人排查问题时看的。
# ============================================================
spring.application.name=snake-backend

# ---- 服务端口 ----
# ★★★ 踩坑记录（必看）★★★
# 本机环境里存在环境变量 SERVER__PORT=58049（WorkBuddy 自己用的端口）。
# Spring Boot 会做"松散绑定"：SERVER__PORT -> server.port，
# 它的优先级【高于】本文件的 server.port，导致后端去抢 58049 端口而启动失败。
# 因此这里用 ${SNAKE_PORT:8080} 读取自定义变量名 SNAKE_PORT 来规避；
# 同时启动脚本里也会用 set "SERVER__PORT=" 清掉那个变量，双保险。
# 端口 8080 被占用时会自动 +1 重试（最多到 8089）。
server.port=${SNAKE_PORT:8080}

# ---- MySQL 数据库 ----
# createDatabaseIfNotExist=true：数据库不存在时自动创建，电脑重置后无需手动建库。
# 用户名 root / 密码 123456（按需求固定）。
spring.datasource.url=jdbc:mysql://localhost:3306/snake_game?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---- 启动加速（重要，别删）----
# 1) schema.sql 每次启动都可能执行，用 IF NOT EXISTS 保证幂等；
# 2) Hikari 连接池默认启动时就要建满连接，改成懒加载 + 只要 1 个连接，
#    并把超时时间调短，避免 MySQL 没起来时卡住几十秒。
spring.sql.init.mode=always
spring.sql.init.continue-on-error=true
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.initialization-fail-timeout=1
spring.datasource.hikari.connection-timeout=3000

# 关闭启动时不需要的检查，缩短启动时间
spring.main.lazy-initialization=false
server.tomcat.threads.min-spare=2

# ---- MyBatis-Plus ----
# 生产/演示环境关掉 SQL 控制台打印可以再快一点；
# 需要看 SQL 时把 log-impl 换成 org.apache.ibatis.logging.stdout.StdOutImpl
mybatis-plus.global-config.db-config.table-underline=true

# ---- 日志 ----
logging.level.root=warn
logging.level.com.fenglin.springboottest=info
